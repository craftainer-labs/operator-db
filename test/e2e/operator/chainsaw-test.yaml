# Installs the Helm chart into a Pod Security `restricted` namespace, with the
# manager running as an arbitrary UID, then exercises the API (CRDs, schema
# defaults and rules, webhooks) end to end. The steps run in order; the
# cluster is thrown away afterwards.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: operator
spec:
  namespaceTemplate:
    metadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
  steps:
    - name: install the chart
      try:
        - script:
            timeout: 5m
            env:
              - name: RELEASE
                value: operator-db
            content: |
              set -eu
              helm upgrade --install "$RELEASE" "$E2E_CHART_DIR" --namespace "$NAMESPACE" \
                --set manager.image.registry= \
                --set manager.image.repository="$E2E_IMAGE_REPOSITORY" \
                --set manager.image.tag="$E2E_IMAGE_TAG" \
                --set manager.image.pullPolicy=Never \
                --set manager.podSecurityContext.runAsUser=12345 \
                --wait --timeout 4m
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: operator-db-controller-manager
              status:
                availableReplicas: 1
      cleanup:
        - script:
            content: helm uninstall operator-db --namespace "$NAMESPACE" --ignore-not-found

    - name: runs as an arbitrary UID with leader election
      try:
        - script:
            content: |
              set -eu
              uid=$(kubectl get pods -n "$NAMESPACE" -l control-plane=controller-manager -o jsonpath='{.items[0].spec.securityContext.runAsUser}')
              test "$uid" = 12345
              ro=$(kubectl get pods -n "$NAMESPACE" -l control-plane=controller-manager -o jsonpath='{.items[0].spec.containers[0].securityContext.readOnlyRootFilesystem}')
              test "$ro" = true
        - assert:
            resource:
              apiVersion: coordination.k8s.io/v1
              kind: Lease
              metadata:
                name: operator-db.craftainer.dev
              (spec.holderIdentity != null): true

    - name: the CRDs are established
      try:
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: clusterdatabaseservers.db.craftainer.dev
              status:
                (conditions[?type == 'Established'] | [0].status): "True"
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: databaseservers.db.craftainer.dev
              status:
                (conditions[?type == 'Established'] | [0].status): "True"
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: databases.db.craftainer.dev
              status:
                (conditions[?type == 'Established'] | [0].status): "True"
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: databaseroles.db.craftainer.dev
              status:
                (conditions[?type == 'Established'] | [0].status): "True"

    - name: the schema defaults a DatabaseServer
      try:
        - apply:
            resource:
              apiVersion: db.craftainer.dev/v1alpha1
              kind: DatabaseServer
              metadata:
                name: defaults
              spec:
                host: pg.example.svc
                adminCredentialsSecretRef:
                  name: pg-admin
        - assert:
            resource:
              apiVersion: db.craftainer.dev/v1alpha1
              kind: DatabaseServer
              metadata:
                name: defaults
              spec:
                port: 5432
                adminDatabase: postgres
                sslMode: verify-full
      cleanup:
        - delete:
            ref:
              apiVersion: db.craftainer.dev/v1alpha1
              kind: DatabaseServer
              name: defaults

    - name: the webhook rejects a bad host
      try:
        - apply:
            resource:
              apiVersion: db.craftainer.dev/v1alpha1
              kind: ClusterDatabaseServer
              metadata:
                name: bad-host
              spec:
                host: "not a host"
                adminCredentialsSecretRef:
                  name: pg-admin
                  namespace: ($namespace)
                allowedNamespaces:
                  from: All
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'host name or an IP address')): true

    - name: the schema rejects a cluster server without allowedNamespaces
      try:
        - apply:
            resource:
              apiVersion: db.craftainer.dev/v1alpha1
              kind: ClusterDatabaseServer
              metadata:
                name: open
              spec:
                host: pg.example.svc
                adminCredentialsSecretRef:
                  name: pg-admin
                  namespace: ($namespace)
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'allowedNamespaces')): true

    - name: metrics need a token
      try:
        - script:
            timeout: 5m
            content: |
              set -eu
              svc="operator-db-controller-manager-metrics-service.${NAMESPACE}.svc:8443"
              kubectl create serviceaccount metrics-client -n "$NAMESPACE"
              kubectl create clusterrolebinding "e2e-metrics-${NAMESPACE}" \
                --clusterrole=operator-db-metrics-reader --serviceaccount="${NAMESPACE}:metrics-client"
              token=$(kubectl create token metrics-client -n "$NAMESPACE")
              # curl runs in `default`: the test namespace enforces `restricted`.
              kubectl run "metrics-curl" -n default --rm -i --restart=Never \
                --image=curlimages/curl@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40 \
                --command -- sh -c "
                  anon=\$(curl -ks -o /dev/null -w '%{http_code}' https://${svc}/metrics)
                  echo anonymous=\$anon
                  test \"\$anon\" = 401 -o \"\$anon\" = 403
                  curl -ks -H 'Authorization: Bearer ${token}' https://${svc}/metrics > /tmp/m
                  grep -q '^go_goroutines' /tmp/m
                  echo authenticated metrics ok"
      cleanup:
        - script:
            content: kubectl delete clusterrolebinding "e2e-metrics-${NAMESPACE}" --ignore-not-found
