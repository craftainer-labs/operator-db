apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "operator-db.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - db.craftainer.dev
  resources:
  - clusterdatabaseservers
  - databaseroles
  - databases
  - databaseservers
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - db.craftainer.dev
  resources:
  - clusterdatabaseservers/finalizers
  - databaseroles/finalizers
  - databases/finalizers
  - databaseservers/finalizers
  verbs:
  - update
- apiGroups:
  - db.craftainer.dev
  resources:
  - clusterdatabaseservers/status
  - databaseroles/status
  - databases/status
  - databaseservers/status
  verbs:
  - get
  - patch
  - update
