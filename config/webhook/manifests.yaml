---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-db-craftainer-dev-v1alpha1-clusterdatabaseserver
  failurePolicy: Fail
  name: vclusterdatabaseserver-v1alpha1.kb.io
  rules:
  - apiGroups:
    - db.craftainer.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - clusterdatabaseservers
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-db-craftainer-dev-v1alpha1-databaseserver
  failurePolicy: Fail
  name: vdatabaseserver-v1alpha1.kb.io
  rules:
  - apiGroups:
    - db.craftainer.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - databaseservers
  sideEffects: None
