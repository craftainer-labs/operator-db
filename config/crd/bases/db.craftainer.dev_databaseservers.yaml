---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: databaseservers.db.craftainer.dev
spec:
  group: db.craftainer.dev
  names:
    categories:
    - craftainer
    kind: DatabaseServer
    listKind: DatabaseServerList
    plural: databaseservers
    singular: databaseserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DatabaseServer is a namespaced PostgreSQL server for a team that brings its
          own: it serves only claims in its own namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of DatabaseServer
            properties:
              adminCredentialsSecretRef:
                description: AdminCredentialsSecretRef names the admin credentials.
                properties:
                  key:
                    description: Key limits the credentials to one key of the Secret.
                    maxLength: 253
                    type: string
                  name:
                    description: Name of the Secret.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace is required on a cluster server (the operator namespace) and
                      forbidden on a namespaced one; the operator's own CEL enforces that.
                    maxLength: 63
                    type: string
                required:
                - name
                type: object
              adminDatabase:
                default: postgres
                description: adminDatabase is the database the admin connection opens.
                maxLength: 63
                minLength: 1
                type: string
              allowedExtensions:
                default: []
                description: |-
                  allowedExtensions limits the extensions a Database may create;
                  spec.extensions of a Database must be a subset.
                items:
                  maxLength: 63
                  pattern: ^[a-z_][a-z0-9_-]*$
                  type: string
                maxItems: 50
                type: array
              credentials:
                description: |-
                  credentials are the credentials to the cloud API: a Secret in the
                  server's namespace (a namespaced server cannot use WorkloadIdentity).
                properties:
                  secretRef:
                    description: SecretRef names the Secret in the server's own namespace.
                    properties:
                      name:
                        description: Name is the Secret's name.
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        description: |-
                          Namespace is the Secret's namespace: required on a cluster server (the
                          controller accepts only the operator's own namespace), forbidden on a
                          namespaced one.
                        maxLength: 63
                        type: string
                    required:
                    - name
                    type: object
                  source:
                    description: Source must be Secret.
                    enum:
                    - WorkloadIdentity
                    - Secret
                    type: string
                required:
                - source
                type: object
                x-kubernetes-validations:
                - message: a namespaced server must use source Secret
                  rule: self.source == 'Secret'
                - message: secretRef is required
                  rule: has(self.secretRef)
                - message: secretRef.namespace is forbidden on a namespaced server
                  rule: '!has(self.secretRef) || !has(self.secretRef.namespace)'
              healthCheckInterval:
                description: |-
                  HealthCheckInterval is how often the server is probed (default 1m,
                  minimum 10s, maximum 1h).
                maxLength: 32
                type: string
                x-kubernetes-validations:
                - message: healthCheckInterval must be between 10s and 1h
                  rule: duration(self) >= duration('10s') && duration(self) <= duration('1h')
              host:
                description: |-
                  host is the server's host name or IP address. It is required without
                  spec.provider; with one it overrides the discovered address (for an
                  emulator whose API and data plane are different processes).
                maxLength: 253
                minLength: 1
                type: string
              port:
                default: 5432
                description: port is the server's TCP port.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              provider:
                description: provider says the server is a managed cloud database.
                properties:
                  aws:
                    description: aws holds the AWS settings.
                    properties:
                      dbClusterIdentifier:
                        description: dbClusterIdentifier is an Aurora DB cluster;
                          its writer endpoint is used.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[A-Za-z][A-Za-z0-9-]*$
                        type: string
                      dbInstanceIdentifier:
                        description: dbInstanceIdentifier is an RDS DB instance.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[A-Za-z][A-Za-z0-9-]*$
                        type: string
                      region:
                        description: Region is the AWS region; the partition follows
                          from it.
                        maxLength: 32
                        pattern: ^[a-z]{2}(-[a-z]+)+-[0-9]+$
                        type: string
                      roleARN:
                        description: RoleARN, when set, is assumed with the source
                          credentials.
                        maxLength: 2048
                        type: string
                        x-kubernetes-validations:
                        - message: 'roleARN must start with arn:'
                          rule: self.startsWith('arn:')
                    required:
                    - region
                    type: object
                    x-kubernetes-validations:
                    - message: set exactly one of dbInstanceIdentifier and dbClusterIdentifier
                      rule: has(self.dbInstanceIdentifier) != has(self.dbClusterIdentifier)
                  azure:
                    description: azure holds the Azure settings (a PostgreSQL flexible
                      server).
                    properties:
                      resourceGroup:
                        description: ResourceGroup is the resource group of the resources.
                        pattern: ^[-\w._()]{1,90}$
                        type: string
                      serverName:
                        description: serverName is the flexible server's name.
                        maxLength: 63
                        minLength: 3
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      subscriptionID:
                        description: SubscriptionID is the subscription of the resources.
                        pattern: ^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
                        type: string
                      tenantID:
                        description: TenantID is the Entra tenant.
                        pattern: ^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
                        type: string
                    required:
                    - serverName
                    - tenantID
                    type: object
                    x-kubernetes-validations:
                    - message: subscriptionID and resourceGroup are required for a
                        flexible server
                      rule: has(self.subscriptionID) && has(self.resourceGroup)
                    - message: resourceGroup must not end with a period (this also
                        rules out . and ..)
                      rule: '!has(self.resourceGroup) || !self.resourceGroup.endsWith(''.'')'
                  gcp:
                    description: gcp holds the Google Cloud settings (a Cloud SQL
                      instance).
                    properties:
                      instance:
                        description: instance is the Cloud SQL instance name.
                        maxLength: 98
                        minLength: 1
                        pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      location:
                        description: Location is the region, required where the resource
                          is regional.
                        maxLength: 64
                        type: string
                      project:
                        description: Project is the project ID.
                        maxLength: 30
                        pattern: ^[a-z][a-z0-9-]{4,28}[a-z0-9]$
                        type: string
                    required:
                    - instance
                    - project
                    type: object
                    x-kubernetes-validations:
                    - message: location is required for a Cloud SQL instance
                      rule: has(self.location) && size(self.location) > 0
                  type:
                    description: 'type is the cloud: AWS, GCP or Azure.'
                    enum:
                    - AWS
                    - GCP
                    - Azure
                    type: string
                    x-kubernetes-validations:
                    - message: provider.type is immutable
                      rule: self == oldSelf
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: aws is required with type AWS and forbidden otherwise
                  rule: 'self.type == ''AWS'' ? has(self.aws) : !has(self.aws)'
                - message: gcp is required with type GCP and forbidden otherwise
                  rule: 'self.type == ''GCP'' ? has(self.gcp) : !has(self.gcp)'
                - message: azure is required with type Azure and forbidden otherwise
                  rule: 'self.type == ''Azure'' ? has(self.azure) : !has(self.azure)'
              proxyURL:
                description: |-
                  ProxyURL is an http, https or socks5 proxy; unset uses the process
                  environment.
                maxLength: 512
                type: string
              sslMode:
                default: verify-full
                description: |-
                  sslMode is the libpq sslmode. verify-full, verify-ca and require are
                  offered; disable, allow and prefer are not. The operator verifies the
                  certificate chain and the host name in every mode; set tls.serverName when
                  the certificate names another host.
                enum:
                - verify-full
                - verify-ca
                - require
                type: string
              tls:
                description: TLS configures verification of the backend.
                properties:
                  caBundle:
                    description: CABundle replaces the system roots.
                    properties:
                      configMapRef:
                        description: ConfigMapRef is a ConfigMap key holding a PEM
                          bundle.
                        properties:
                          key:
                            default: ca.crt
                            description: Key inside it. Defaults to ca.crt.
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            description: Name of the Secret or ConfigMap.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      secretRef:
                        description: SecretRef is a Secret key holding a PEM bundle.
                        properties:
                          key:
                            default: ca.crt
                            description: Key inside it. Defaults to ca.crt.
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            description: Name of the Secret or ConfigMap.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of secretRef and configMapRef
                      rule: has(self.secretRef) != has(self.configMapRef)
                  minVersion:
                    default: "1.2"
                    description: MinVersion is the TLS floor.
                    enum:
                    - "1.2"
                    - "1.3"
                    type: string
                  serverName:
                    description: ServerName overrides the host used for certificate
                      verification.
                    maxLength: 253
                    type: string
                type: object
            required:
            - adminCredentialsSecretRef
            type: object
            x-kubernetes-validations:
            - message: 'adminCredentialsSecretRef.namespace is forbidden on a namespaced
                server: the Secret is in the server''s namespace'
              rule: '!has(self.adminCredentialsSecretRef.namespace)'
            - message: host is required without provider
              rule: has(self.provider) || (has(self.host) && size(self.host) > 0)
            - message: only provider.type AWS, GCP and Azure are supported
              rule: '!has(self.provider) || self.provider.type in [''AWS'', ''GCP'',
                ''Azure'']'
            - message: credentials is allowed only with provider
              rule: '!has(self.credentials) || has(self.provider)'
            - message: 'a namespaced server with a provider must set credentials with
                source Secret: it cannot use WorkloadIdentity'
              rule: '!has(self.provider) || has(self.credentials)'
          status:
            description: status defines the observed state of DatabaseServer
            properties:
              conditions:
                description: Conditions holds Ready and ServerReachable.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              discovered:
                additionalProperties:
                  type: string
                description: |-
                  discovered is what the probe read from the cloud: endpoint, port,
                  resourceId, accountId and region on AWS; endpoint, port, region,
                  instanceConnectionName and dnsName on Cloud SQL; endpoint, port, resourceId
                  and region on an Azure flexible server.
                maxProperties: 10
                type: object
                x-kubernetes-validations:
                - message: values are at most 512 characters
                  rule: self.all(k, size(self[k]) <= 512)
              lastProbeTime:
                description: LastProbeTime is when the server was last probed.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the metadata.generation last reconciled.
                format: int64
                type: integer
              serverVersion:
                description: ServerVersion is the version the backend reported.
                maxLength: 64
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
