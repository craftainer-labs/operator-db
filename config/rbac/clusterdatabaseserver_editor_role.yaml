# This rule is not used by the project operator-db itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the db.craftainer.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: operator-db
    app.kubernetes.io/managed-by: kustomize
  name: clusterdatabaseserver-editor-role
rules:
- apiGroups:
  - db.craftainer.dev
  resources:
  - clusterdatabaseservers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - db.craftainer.dev
  resources:
  - clusterdatabaseservers/status
  verbs:
  - get
