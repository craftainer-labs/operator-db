---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - db.craftainer.dev
  resources:
  - clusterdatabaseservers
  - databaseroles
  - databases
  - databaseservers
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - db.craftainer.dev
  resources:
  - clusterdatabaseservers/finalizers
  - databaseroles/finalizers
  - databases/finalizers
  - databaseservers/finalizers
  verbs:
  - update
- apiGroups:
  - db.craftainer.dev
  resources:
  - clusterdatabaseservers/status
  - databaseroles/status
  - databases/status
  - databaseservers/status
  verbs:
  - get
  - patch
  - update
