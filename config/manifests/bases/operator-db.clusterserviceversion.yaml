apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[]'
    capabilities: Basic Install
    categories: Developer Tools
    description: A Kubernetes operator that provisions PostgreSQL databases and roles (db.craftainer.dev).
    # Pod Security `restricted` and a suggested install namespace for OLM v0
    # (OLM v1 installs into the ClusterExtension's namespace).
    operatorframework.io/suggested-namespace: operator-db-system
    # OpenShift infrastructure features (EB-5): "disconnected" is true when
    # every image the operator runs is listed in spec.relatedImages (the
    # bundle step pins and lists the manager image). Add "proxy-aware" once
    # the operator honours HTTP(S)_PROXY/NO_PROXY, and "fips-compliant" for a
    # build with GOFIPS140 (see the Dockerfile) run with GODEBUG=fips140=on.
    operators.openshift.io/infrastructure-features: '["disconnected"]'
    repository: https://github.com/craftainer-labs/operator-db
  name: operator-db.v0.0.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: ClusterDatabaseServer is a cluster-scoped PostgreSQL server that
        claims in the namespaces allowedNamespaces admits can use.
      displayName: Cluster Database Server
      kind: ClusterDatabaseServer
      name: clusterdatabaseservers.db.craftainer.dev
      version: v1alpha1
    - description: DatabaseServer is a namespaced PostgreSQL server for a team that
        brings its own.
      displayName: Database Server
      kind: DatabaseServer
      name: databaseservers.db.craftainer.dev
      version: v1alpha1
    - description: Database is a PostgreSQL database on a ClusterDatabaseServer or
        a DatabaseServer.
      displayName: Database
      kind: Database
      name: databases.db.craftainer.dev
      version: v1alpha1
    - description: DatabaseRole is a PostgreSQL login with access to one Database.
      displayName: Database Role
      kind: DatabaseRole
      name: databaseroles.db.craftainer.dev
      version: v1alpha1
  description: |-
    Provisions PostgreSQL databases and roles from Kubernetes objects. A
    ClusterDatabaseServer (or a namespaced DatabaseServer) describes a server;
    a Database and a DatabaseRole in a tenant namespace claim a database and a
    login on it, and the login's credentials are written to a Secret of type
    servicebinding.io/postgresql.
  displayName: Database Operator
  install:
    spec:
      deployments: null
    strategy: ""
  # AllNamespaces is the only mode OLM v1 (ClusterExtension) installs without
  # legacy compatibility; OLM v0 supports it too.
  installModes:
  - supported: false
    type: OwnNamespace
  - supported: false
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
  - operator
  - craftainer
  links:
  - name: Source
    url: https://github.com/craftainer-labs/operator-db
  maintainers:
  - email: maintainers@example.com
    name: Maintainers
  maturity: alpha
  minKubeVersion: 1.33.0
  provider:
    name: craftainer
    url: https://github.com/craftainer
  # The manager image is added by `make bundle` (scripts/bundle-fixup.sh) with
  # the digest it was built for.
  relatedImages: []
  version: 0.0.0
