# Instance-owned, never touched by template sync: an instance puts its
# `include:` stack fragments and any extra `services.myapp` settings
# (`env_file`, `environment`, `depends_on`) here, so `compose.yml` stays
# template-owned.
#
# The PostgreSQL the integration tests (`test/integration`, build tag
# `integration`) run against: a real server with TLS on (a CA and server
# certificate generated at start by `pg-tls-init`), scram-sha-256 and
# `hostssl` only, so the operator's verify-full connections are exercised for
# real. The same scripts and image pin run in `.github/workflows/integration.yml`.
# Run the tests from the devcontainer with
#   go test -tags integration -count=1 ./test/integration/...
# (the environment below points them at the server).
services:
  myapp:
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_ADMIN_USER: postgres
      PG_ADMIN_PASSWORD_FILE: /pg-tls/admin-password
      PG_CA_FILE: /pg-tls/ca.crt
    volumes:
      - pg-tls:/pg-tls:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Generates the CA, the server certificate (names: postgres, localhost,
  # 127.0.0.1) and the admin password into the pg-tls volume, on every start.
  pg-tls-init:
    # renovate: datasource=docker depName=alpine/openssl
    image: alpine/openssl:3.5.9@sha256:6821afa2476e11be343f29275f2ca24291720ff0a7148bd131fd8e314ff26d9e
    entrypoint: ["sh", "/it/gen-certs.sh", "/tls"]
    volumes:
      - ../test/integration:/it:ro
      - pg-tls:/tls
    restart: "no"

  postgres:
    # renovate: datasource=docker depName=postgres
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    entrypoint: ["sh", "/it/pg-entrypoint.sh"]
    environment:
      POSTGRES_PASSWORD_FILE: /tls/admin-password
    volumes:
      - ../test/integration:/it:ro
      - pg-tls:/tls:ro
    depends_on:
      pg-tls-init:
        condition: service_completed_successfully
    healthcheck:
      # The socket is `trust` inside the container (see pg-entrypoint.sh).
      test: ["CMD-SHELL", "pg_isready -U postgres -h /var/run/postgresql"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pg-tls:
